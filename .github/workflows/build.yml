name: Build Chrome extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript and run tests
        run: |
          find extension -type f \( -name '*.js' -o -name '*.mjs' \) \
            -exec bash -ec 'for file; do node --check "$file"; done' _ {} +
          node --test
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match manifest version v$version" >&2
            exit 1
          fi
      - name: Upload installable ZIP as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: munzee-map-gpx-exporter
          path: extension/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: extension
          merge-multiple: true
      - name: Package the tested extension
        id: zip
        working-directory: extension
        run: |
          test -f manifest.json
          archive="munzee-map-gpx-exporter.zip"
          zip -qr "../$archive" .
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.zip.outputs.path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --verify-tag --generate-notes
          fi
